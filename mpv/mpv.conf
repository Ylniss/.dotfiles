# Cap quality at 720p (1080p was laggy on this hardware/connection)
ytdl-format=bestvideo[height<=?720]+bestaudio/best

# Resume playback where you left off
save-position-on-quit=yes

# Hardware decoding (battery savings on the Surface)
hwdec=auto-safe

# Hide cursor after 1s of inactivity
cursor-autohide=1000

# Don't blast volume on first play
volume=70

# On-screen controller (timeline at bottom on mouse hover)
osc=yes

# Don't auto-close when video ends — pause on last frame instead
keep-open=yes

# Start fullscreen so mpv knows its own state (niri-imposed fullscreen leaves
# mpv thinking it's windowed, which keeps the OSC visible).
fs=yes

# YouTube auto-generated captions (English only) — fetched via yt-dlp.
# Note: YouTube's auto-caption VTT uses rolling-update cues with overlapping
# timestamps, so a "stale" line can briefly persist while the next cue is
# being drawn. There's no clean fix without losing auto-captions entirely.
ytdl-raw-options-append=write-auto-subs=
ytdl-raw-options-append=sub-langs=en.*
sub-auto=fuzzy

# Prefer English tracks so mpv auto-selects them on load.
slang=en,eng

# Subs off by default — press 'v' to toggle visibility, 'j' to cycle tracks
sub-visibility=no
