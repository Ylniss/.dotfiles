# SponsorBlock categories to skip.
# Separated by semicolons (NOT commas).
# Full list: https://wiki.sponsor.ajay.app/w/Types
#
# Auto-skip is the default behavior of this script.
# Press 'b' in mpv to toggle SponsorBlock on/off per session.
categories=sponsor;intro;outro;selfpromo

# Send only a SHA256 hash prefix instead of the full video ID to the
# SponsorBlock server (privacy). Set to "true" to enable.
hash=

# SponsorBlock API endpoint.
server=https://sponsor.ajay.app/api/skipSegments
