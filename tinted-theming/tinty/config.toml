# tinty config — owns ~/.local/share/tinted-theming/tinty/current_scheme.
#
# Pattern A — canonical [[items]]:
#   wezterm  — symlinks repo's themes/wezterm dir → ~/.config/wezterm/colors;
#              wezterm.lua reads current_scheme slug + auto-discovers TOML
#
# Pattern B — subscriber (no [[items]] entry, tool watches current_scheme):
#   nvim     — tinted-nvim plugin selector watches current_scheme
#
# Phase 2c will add foot, fzf, yazi, fuzzel, mako (canonical where upstream exists).

[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-wezterm"
themes-dir = "themes/wezterm"
supported-systems = ["base16", "base24"]
hook = """
SRC=$HOME/.local/share/tinted-theming/tinty/repos/tinted-wezterm/themes/wezterm
WEZTERM_DIR="$HOME/.config/wezterm"
if [ -d "$SRC" ]; then
    mkdir -p "$WEZTERM_DIR"
    ln -sfn "$SRC" "$WEZTERM_DIR/colors"
    touch -c "$WEZTERM_DIR/wezterm.lua"
fi
"""

[[items]]
path = "https://github.com/tinted-theming/base16-waybar"
name = "tinted-waybar"
themes-dir = "colors"
supported-systems = ["base16"]
hook = """
SLUG=$(cat $HOME/.local/share/tinted-theming/tinty/current_scheme)
SRC=$HOME/.local/share/tinted-theming/tinty/repos/tinted-waybar/colors/${SLUG}.css
DST=$HOME/.config/waybar/colors.css
if [ -f "$SRC" ]; then
    mkdir -p "$(dirname "$DST")"
    cp "$SRC" "$DST"
    pkill -SIGUSR2 waybar 2>/dev/null || true
fi
"""

[[items]]
path = "https://github.com/tinted-theming/base16-qutebrowser"
name = "tinted-qutebrowser"
themes-dir = "themes/default"
theme-file-extension = ".config.py"
supported-systems = ["base16"]
hook = """
SLUG=$(cat $HOME/.local/share/tinted-theming/tinty/current_scheme)
SRC=$HOME/.local/share/tinted-theming/tinty/repos/tinted-qutebrowser/themes/default/${SLUG}.config.py
DST=$HOME/.config/qutebrowser/colors.config.py
if [ -f "$SRC" ]; then
    mkdir -p "$(dirname "$DST")"
    cp "$SRC" "$DST"
    if pgrep -x qutebrowser >/dev/null; then
        qutebrowser :config-source 2>/dev/null || true
    fi
fi
"""

# tinty auto-writes the rendered yml to its data dir; lazygit reads it via
# LG_CONFIG_FILE (set in nushell/env.nu). No hook needed.
[[items]]
path = "https://github.com/tinted-theming/tinted-lazygit"
name = "tinted-lazygit"
themes-dir = "themes"
supported-systems = ["base16"]
