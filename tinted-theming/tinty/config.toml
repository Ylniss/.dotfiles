# tinty config — owns ~/.local/share/tinted-theming/tinty/current_scheme.
#
# Pattern A — canonical [[items]]:
#   wezterm  — symlinks repo's themes/wezterm dir → ~/.config/wezterm/colors;
#              wezterm.lua reads current_scheme slug + auto-discovers TOML
#
# Pattern B — subscriber (no [[items]] entry, tool watches current_scheme):
#   nvim     — tinted-nvim plugin selector watches current_scheme
#
# Phase 2d will add fuzzel, mako (no upstream — community repos or custom templates).

[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-wezterm"
themes-dir = "themes/wezterm"
supported-systems = ["base16", "base24"]
hook = """
SRC=$HOME/.local/share/tinted-theming/tinty/repos/tinted-wezterm/themes/wezterm
WEZTERM_DIR="$HOME/.config/wezterm"
if [ -d "$SRC" ]; then
    mkdir -p "$WEZTERM_DIR"
    ln -sfn "$SRC" "$WEZTERM_DIR/colors"
    touch -c "$WEZTERM_DIR/wezterm.lua"
fi
"""

[[items]]
path = "https://github.com/tinted-theming/base16-waybar"
name = "tinted-waybar"
themes-dir = "colors"
supported-systems = ["base16"]
hook = """
SLUG=$(cat $HOME/.local/share/tinted-theming/tinty/current_scheme)
SRC=$HOME/.local/share/tinted-theming/tinty/repos/tinted-waybar/colors/${SLUG}.css
DST=$HOME/.config/waybar/colors.css
if [ -f "$SRC" ]; then
    mkdir -p "$(dirname "$DST")"
    cp "$SRC" "$DST"
    pkill -SIGUSR2 waybar 2>/dev/null || true
fi
"""

[[items]]
path = "https://github.com/tinted-theming/base16-qutebrowser"
name = "tinted-qutebrowser"
themes-dir = "themes/default"
theme-file-extension = ".config.py"
supported-systems = ["base16"]
hook = """
SLUG=$(cat $HOME/.local/share/tinted-theming/tinty/current_scheme)
SRC=$HOME/.local/share/tinted-theming/tinty/repos/tinted-qutebrowser/themes/default/${SLUG}.config.py
DST=$HOME/.config/qutebrowser/colors.config.py
if [ -f "$SRC" ]; then
    mkdir -p "$(dirname "$DST")"
    cp "$SRC" "$DST"
    if pgrep -x qutebrowser >/dev/null; then
        qutebrowser :config-source 2>/dev/null || true
    fi
fi
"""

# tinty auto-writes the rendered yml to its data dir; lazygit reads it via
# LG_CONFIG_FILE (set in nushell/env.nu). No hook needed.
[[items]]
path = "https://github.com/tinted-theming/tinted-lazygit"
name = "tinted-lazygit"
themes-dir = "themes"
supported-systems = ["base16"]

[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-foot"
themes-dir = "themes/foot"
supported-systems = ["base16", "base24"]
hook = """
SLUG=$(cat $HOME/.local/share/tinted-theming/tinty/current_scheme)
SRC=$HOME/.local/share/tinted-theming/tinty/repos/tinted-foot/themes/foot/${SLUG}.ini
DST=$HOME/.config/foot/colors.ini
if [ -f "$SRC" ]; then
    mkdir -p "$(dirname "$DST")"
    cp "$SRC" "$DST"
    pkill -USR1 foot 2>/dev/null || true
fi
"""

# tinted-fzf renders an `export FZF_DEFAULT_OPTS=...` shell snippet. Nushell
# can't source sh, so the hook sources it in a subshell and writes the
# resulting opts string to a plain file that env.nu reads.
[[items]]
path = "https://github.com/tinted-theming/tinted-fzf"
name = "tinted-fzf"
themes-dir = "sh"
supported-systems = ["base16"]
hook = """
SLUG=$(cat $HOME/.local/share/tinted-theming/tinty/current_scheme)
SRC=$HOME/.local/share/tinted-theming/tinty/repos/tinted-fzf/sh/${SLUG}.sh
DST=$HOME/.local/share/tinted-theming/tinty/fzf-colors
if [ -f "$SRC" ]; then
    FZF_DEFAULT_OPTS=""
    . "$SRC"
    echo "$FZF_DEFAULT_OPTS" > "$DST"
fi
"""

# yazi flavors are directories: ~/.config/yazi/flavors/<name>.yazi/flavor.toml.
# theme.toml references the flavor name `tinted`.
[[items]]
path = "https://github.com/tinted-theming/tinted-yazi"
name = "tinted-yazi"
themes-dir = "flavors"
supported-systems = ["base16"]
hook = """
SLUG=$(cat $HOME/.local/share/tinted-theming/tinty/current_scheme)
SRC=$HOME/.local/share/tinted-theming/tinty/repos/tinted-yazi/flavors/${SLUG}.toml
DST=$HOME/.config/yazi/flavors/tinted.yazi/flavor.toml
if [ -f "$SRC" ]; then
    mkdir -p "$(dirname "$DST")"
    cp "$SRC" "$DST"
fi
"""

# Sentinel item — tinted-shell only satisfies tinty's per-item theme-file
# lookup; the hook ignores it and runs nu scripts that render fuzzel/mako
# color partials from the active scheme yaml.
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-base16-extras"
themes-dir = "scripts"
supported-systems = ["base16"]
hook = """
DOTFILES=$HOME/stuff/repo/.dotfiles
nu "$DOTFILES/tinted-theming/render-fuzzel.nu" || true
nu "$DOTFILES/tinted-theming/render-mako.nu" || true
"""
