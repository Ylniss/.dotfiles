[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "cd ~/stuff/"
desc = "Go stuff"

[[mgr.prepend_keymap]]
on = ["g", "n"]
run = "cd ~/stuff/knowtes/"
desc = "Go Obsidian knowtes"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = "cd ~/stuff/repo/"
desc = "Go repo"

[[mgr.prepend_keymap]]
on = ["g", "a"]
run = "cd /games/"
desc = "Go games"

[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "cd ~/stuff/movies/"
desc = "Go movies"

[[mgr.prepend_keymap]]
on = ["g", "/"]
run = "cd /"
desc = "Go root"

[[mgr.prepend_keymap]]
on = ["g", "i"]
run = "plugin lazygit"
desc = "Open lazygit"
