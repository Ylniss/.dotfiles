[mgr]
show_hidden = true
sort_by = "extension"
sort_reverse = false
sort_fallback = "natural"
sort_dir_first = true
linemode = "size_and_mtime"

[preview]
max_width = 1000
max_height = 1000
wrap = "yes"

# Replace slow file.exe MIME detection with extension-based lookup.
# Installed via: ya pkg add yazi-rs/plugins:mime-ext
[[plugin.prepend_fetchers]]
group = "mime"
url = "local://*"
run = "mime-ext.local"
prio = "high"

[[plugin.prepend_fetchers]]
group = "mime"
url = "remote://*"
run = "mime-ext.remote"
prio = "high"

# Syntax-highlight .nu via bat (yazi's bundled syntect lacks nushell).
# Requires: bat, sh on PATH
[[plugin.prepend_previewers]]
url = "*.nu"
run = 'piper -- bat --color=always --theme=ansi --style=plain --paging=never "$1"'

# Open text files in nvim by default; SVGs in Inkscape; office docs in OnlyOffice; scripts via the system
[opener]
edit = [
	{ run = 'nvim %s', block = true, desc = "nvim", for = "unix" },
	{ run = 'nvim %s', block = true, desc = "nvim", for = "windows" },
]
inkscape = [
	{ run = 'inkscape %s', orphan = true, desc = "Inkscape", for = "unix" },
	{ run = 'inkscape %s', orphan = true, desc = "Inkscape", for = "windows" },
]
onlyoffice = [
	{ run = 'onlyoffice-desktopeditors %s', orphan = true, desc = "OnlyOffice", for = "unix" },
	# Full exe path required: DesktopEditors.exe is not on PATH, and .docx maps to Word in the system associations
	{ run = '"C:\Program Files\ONLYOFFICE\DesktopEditors\DesktopEditors.exe" %s', orphan = true, desc = "OnlyOffice", for = "windows" },
]
system = [
	{ run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]
imv = [
	{ run = 'imv -n %s1 %d1', orphan = true, desc = "imv", for = "unix" },
	{ run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]

# Scripts stay previewable as text, but run through the system opener
[[open.prepend_rules]]
url = "*.bat"
use = "system"

[[open.prepend_rules]]
url = "*.cmd"
use = "system"

[[open.prepend_rules]]
mime = "text/*"
use = "edit"

[[open.prepend_rules]]
mime = "application/xml"
use = "edit"

[[open.prepend_rules]]
mime = "application/json"
use = "edit"

[[open.prepend_rules]]
mime = "application/javascript"
use = "edit"

[[open.prepend_rules]]
url = "*.docx"
use = "onlyoffice"

[[open.prepend_rules]]
url = "*.xlsx"
use = "onlyoffice"

[[open.prepend_rules]]
mime = "image/svg+xml"
use = "inkscape"

[[open.prepend_rules]]
mime = "image/*"
use = "imv"
