[mgr]
show_hidden = true
sort_by = "mtime"
sort_reverse = true
sort_dir_first = true
linemode = "size_and_mtime"

[preview]
max_width = 1000
max_height = 1000
wrap = "yes"

# Replace slow file.exe MIME detection with extension-based lookup.
# Installed via: ya pkg add yazi-rs/plugins:mime-ext
[[plugin.prepend_fetchers]]
group = "mime"
url = "local://*"
run = "mime-ext.local"
prio = "high"

[[plugin.prepend_fetchers]]
group = "mime"
url = "remote://*"
run = "mime-ext.remote"
prio = "high"

# Syntax-highlight .nu via bat (yazi's bundled syntect lacks nushell).
# Requires: bat, sh on PATH
[[plugin.prepend_previewers]]
url = "*.nu"
run = 'piper -- bat --color=always --theme=ansi --style=plain --paging=never "$1"'

# Open text files in nvim by default; SVGs in Inkscape
[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "nvim", for = "unix" },
	{ run = 'nvim %*', block = true, desc = "nvim", for = "windows" },
]
inkscape = [
	{ run = 'inkscape "$@"', orphan = true, desc = "Inkscape", for = "unix" },
	{ run = 'inkscape %*', orphan = true, desc = "Inkscape", for = "windows" },
]
imv = [
	{ run = 'imv -n "$1" "$(dirname "$1")"', orphan = true, desc = "imv", for = "unix" },
]

[[open.prepend_rules]]
mime = "text/*"
use = "edit"

[[open.prepend_rules]]
mime = "application/xml"
use = "edit"

[[open.prepend_rules]]
mime = "application/json"
use = "edit"

[[open.prepend_rules]]
mime = "application/javascript"
use = "edit"

[[open.prepend_rules]]
mime = "image/svg+xml"
use = "inkscape"

[[open.prepend_rules]]
mime = "image/*"
use = "imv"
