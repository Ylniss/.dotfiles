// Read after librewolf.cfg, so these values win.
// Symlinked by librewolf_init.nu to where the installed build reads it.

/** Dark websites.
 * resistFingerprinting forces `prefers-color-scheme: light` on every site, so
 * it has to go. Fingerprinting protection replaces it with all its targets
 * except the colour scheme one. This weakens fingerprinting resistance.
 * https://librewolf.net/docs/faq/
 */
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CSSPrefersColorScheme");

// Website colour scheme: 0 = dark, 1 = light, 2 = follow the system.
defaultPref("layout.css.prefers-color-scheme.content-override", 0);
// Dark browser UI and dark about: pages, unless a light theme is picked in about:addons.
defaultPref("ui.systemUsesDarkTheme", 1);

defaultPref("sidebar.verticalTabs", true);

// Home page and new windows, instead of the LibreWolf start page.
defaultPref("browser.startup.homepage", "https://duckduckgo.com");

// Reopen the previous tabs at startup.
defaultPref("browser.startup.page", 3);

// Read chrome/userChrome.css from the profile.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
